name: CI

# CPU only, and needs no credential: everything below runs against the committed
# fixture corpus in fixtures/corpus/. `modal` is a pinned dependency and there is a
# schema/harness test suite, but no test calls Modal: the package imports without a
# credential, and the one live Modal call this repo makes runs by hand
# (scripts/hand_run.py), never in CI. This workflow deliberately has no secret.
#
# pull_request is included (not just push) so a fork PR gets a real CI run instead of
# a green badge that never ran anything, which matters once this repo is public.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install package (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Import check
        run: python -c "import genai_corpus; print(genai_corpus.__version__)"

      - name: Unit tests
        run: pytest -q

      - name: Register the notebook kernel
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Notebook smoke test
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=120 \
            --output executed_smoke_test.ipynb \
            notebooks/smoke_test.ipynb
