name: CI

# CPU only, and needs no credential: everything below runs against the committed
# fixture corpus in fixtures/corpus/. SPZ-44 is the first ticket in this series to add
# a repository secret (Modal/Hugging Face); this workflow deliberately has none.
on:
  push:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Import check
        run: python -c "import genai_corpus; print(genai_corpus.__version__)"

      - name: Unit tests
        run: pytest -q

      - name: Register the notebook kernel
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Notebook smoke test
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=120 \
            --output executed_smoke_test.ipynb \
            notebooks/smoke_test.ipynb
