[project]
name = "genai-corpus"
# Read from src/genai_corpus/_version.py, never restated here. `__version__` is a
# published ledger field (SPZ-44), so two unsynced copies of it would eventually mean
# a committed ledger claiming a version that was never released.
dynamic = ["version"]
description = "Shared corpus loaders and cost-ledger schema for the Generative AI Engineering series"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alex Spivakovsky", email = "alex.spivakovsky@gmail.com" }]
# Pinned, not a floor: the series' units measure and publish cost numbers against one
# interpreter. Widen only with a deliberate re-verification across every unit repo.
requires-python = "==3.12.*"
dependencies = [
    # Exact pin, not a range: this is a runtime dependency the harness's cost numbers
    # depend on (SPZ-44), vetted through /dependency-guard (ALLOW; modal-labs/modal-client
    # provenance confirmed via PyPI metadata, no OSV advisories, no typosquat match).
    # Importing it needs no credential — only an actual Modal call does, and CI never
    # makes one. Bump deliberately, re-running the gate, not by tracking a range.
    "modal==1.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "jupyter>=1.0,<2",
    "nbconvert>=7.0,<8",
    "ipykernel>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/genai_corpus/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/genai_corpus"]
